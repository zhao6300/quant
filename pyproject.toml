[project]
name = "mmqp"
version = "0.1.0"
description = "Local multi-market quantitative research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.2",
  "pycountry>=24,<26",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.12.0",
  "pydantic-settings==2.14.2",
  "pyarrow==23.0.0",
  "duckdb==1.5.5",
  "typer==0.26.8",
  "numpy==2.2.6",
  "scipy==1.13.1",
  "cvxpy==1.9.2",
  "akshare>=1.18.94",
  "baostock>=0.9.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "httpx==0.28.1",
  "hypothesis==6.131.0",
  "coverage==7.10.6",
  "cryptography==46.0.5",
  "mypy==1.20.2",
  "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mmqp"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true
